<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير اليوم</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: #f3f6f9;
  color: #222;
}

.container {
  width: 94%;
  max-width: 850px;
  margin: 20px auto;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.day-info {
  text-align: center;
  margin-bottom: 20px;
  color: #555;
  font-size: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
}

.details {
  background: #f7f7f7;
  border-right: 4px solid #777;
  padding: 12px;
  border-radius: 8px;
  line-height: 1.8;
  margin-bottom: 14px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.status-btn {
  border: none;
  padding: 11px 15px;
  border-radius: 9px;
  background: #e9ecef;
  cursor: pointer;
  font-size: 15px;
  transition: 0.2s;
}

.status-btn:hover {
  transform: translateY(-1px);
}

.status-btn.selected {
  background: #198754;
  color: white;
}

.extra-box,
.partial-box {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
}

.partial-box {
  background: #fff8e1;
  border: 1px solid #f0c36d;
}

.extra-box {
  background: #eaf7ee;
  border: 1px solid #8bc79c;
}

.extra-box label,
.partial-box label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
  font-family: inherit;
  font-size: 15px;
}

.quick-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.quick-btn {
  border: none;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
  background: #e7f0ff;
  font-size: 14px;
}

.submit-btn {
  width: 100%;
  border: none;
  background: #0d6efd;
  color: white;
  padding: 15px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  margin-top: 5px;
}

.submit-btn:hover {
  background: #0b5ed7;
}

.message {
  margin-top: 14px;
  padding: 12px;
  border-radius: 9px;
  display: none;
  text-align: center;
}

.message.error {
  display: block;
  background: #ffe5e5;
  color: #a40000;
}

.message.success {
  display: block;
  background: #e4f7e9;
  color: #146c2e;
}

.success-box {
  display: none;
  background: #e8f7ed;
  color: #146c2e;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  margin-top: 15px;
  font-size: 17px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat {
  background: white;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

.stat-number {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 5px;
}

.progress-message {
  background: white;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 18px;
}

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.navigation button {
  flex: 1;
  border: none;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  background: #6c757d;
  color: white;
}

@media (max-width: 600px) {
  .stats {
    grid-template-columns: 1fr;
  }

  .buttons {
    flex-direction: column;
  }

  .status-btn {
    width: 100%;
  }

  .navigation {
    flex-direction: column;
  }
}
</style>
</head>

      </button>

        لم يتم

  </div>

  <div class="message" id="reportMessage"></div>

  <button class="submit-btn" id="submitButton">
    📤 تسجيل تقرير اليوم
  </button>

  <div class="success-box" id="successBox">
    ✅ تم تسجيل تقرير اليوم بنجاح

  <div class="navigation">
    <button onclick="location.href='index.html'">
      🏠 الرئيسية
    </button>

    <button onclick="location.href='plan.html'">

</div>

let state = {
  newStatus: JSON.parse(localStorage.getItem("qt_newStatus") || "{}"),
  treasureStatus: JSON.parse(localStorage.getItem("qt_treasureStatus") || "{}"),
  fixStatus: JSON.parse(localStorage.getItem("qt_fixStatus") || "{}"),
  partials: JSON.parse(localStorage.getItem("qt_partials") || "{}"),
  extra: JSON.parse(localStorage.getItem("qt_extra") || "{}"),
  reportSubmitted: JSON.parse(localStorage.getItem("qt_reportSubmitted") || "{}"),
  reportSubmittedAt: JSON.parse(localStorage.getItem("qt_reportSubmittedAt") || "{}"),
  startDate: localStorage.getItem("qt_startDate") || ""
};


/* =========================================================
   تحديد اليوم
   ========================================================= */

const params = new URLSearchParams(location.search);

let day = parseInt(
  params.get("day") ||
  localStorage.getItem("qt_currentDay") ||
  "1",
  10
);

if (isNaN(day)) day = 1;

day = Math.max(1, Math.min(90, day));


/* =========================================================
   التاريخ
   ========================================================= */

function getDayDate() {
  if (!state.startDate) return null;

  const date = new Date(
    state.startDate + "T00:00:00"
  );

  date.setDate(
    date.getDate() + day - 1
  );

  return date;
}

function formatDate(date) {
  if (!date) return "";

  return date.toLocaleDateString("ar-EG", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}


/* =========================================================
   التثبيت
   مهم: اليوم الأول ليس فيه تثبيت
   ========================================================= */

function getFixationForDay(d) {

  if (d === 1) {
    return null;
  }

  for (let i = 0; i < quarterStartDays.length; i++) {

    const startDay = quarterStartDays[i];

    for (let j = 0; j < fixIntervals.length; j++) {

      const targetDay =
        startDay + fixIntervals[j];

      if (targetDay === d) {
        return fixationPlan[i];
      }

    }
  }

  return null;
}


/* =========================================================
   عرض تفاصيل اليوم
   ========================================================= */

function renderDay() {

  const date = getDayDate();

  document.getElementById("dayInfo").textContent =
    "اليوم " +
    day +
    (date ? " — " + formatDate(date) : "");

  document.getElementById("treasureDetails").textContent =
    treasurePlan[day - 1] || "لا يوجد تفاصيل لهذا اليوم.";

  if (day <= 18) {

    document.getElementById("newDetails").textContent =
      newPlan[day - 1] || "لا يوجد تفاصيل لهذا اليوم.";

  } else {

    document.getElementById("newDetails").textContent =
      "لا يوجد جديد في هذا اليوم حسب الخطة الحالية.";

    document
      .getElementById("newButtons")
      .style.display = "none";

    document
      .getElementById("newPartial")
      .style.display = "none";

    document
      .getElementById("newExtra")
      .style.display = "none";

    document
      .querySelector(".card:nth-of-type(2)")
      .querySelector(".quick-buttons")
      .style.display = "none";
  }

  const fixToday = getFixationForDay(day);

  if (!fixToday) {

    document.getElementById("fixCard").style.display = "none";

  } else {

    document.getElementById("fixCard").style.display = "block";

    document.getElementById("fixDetails").textContent =
      fixToday;
  }
}


/* =========================================================
   حفظ الحالة محليًا
   ========================================================= */

function saveState() {

  localStorage.setItem(
    "qt_newStatus",
    JSON.stringify(state.newStatus)
  );

  localStorage.setItem(
    "qt_treasureStatus",
    JSON.stringify(state.treasureStatus)
  );

  localStorage.setItem(
    "qt_fixStatus",
    JSON.stringify(state.fixStatus)
  );

  localStorage.setItem(
    "qt_partials",
    JSON.stringify(state.partials)
  );

  localStorage.setItem(
    "qt_extra",
    JSON.stringify(state.extra)
  );

  localStorage.setItem(
    "qt_reportSubmitted",
    JSON.stringify(state.reportSubmitted)
  );

  localStorage.setItem(
    "qt_reportSubmittedAt",
    JSON.stringify(state.reportSubmittedAt)
  );
}


/* =========================================================
   إظهار خانة الجزئي أو الزيادة
   ========================================================= */

function updateExtraPartialBoxes(section) {

  let status;

  if (section === "treasure") {
    status = state.treasureStatus[day];
  } else if (section === "new") {
    status = state.newStatus[day];
  }

  const partialBox =
    document.getElementById(
      section === "treasure"
        ? "treasurePartial"
        : "newPartial"
    );

  const extraBox =
    document.getElementById(
      section === "treasure"
        ? "treasureExtra"
        : "newExtra"
    );

  if (!partialBox || !extraBox) return;

  partialBox.style.display =
    status === "partial"
      ? "block"
      : "none";

  extraBox.style.display =
    status === "extra"
      ? "block"
      : "none";
}


/* =========================================================
   تحديد زر الحالة
   ========================================================= */

function refreshButtons() {

  document.querySelectorAll(".status-btn").forEach(button => {

    const section =
      button.dataset.section;

    const status =
      button.dataset.status;

    let current = "";

    if (section === "treasure") {
      current = state.treasureStatus[day] || "";
    }

    if (section === "new") {
      current = state.newStatus[day] || "";
    }

    if (section === "fix") {
      current = state.fixStatus[day] || "";
    }

    button.classList.toggle(
      "selected",
      current === status
    );

  });

  updateExtraPartialBoxes("treasure");
  updateExtraPartialBoxes("new");
}


/* =========================================================
   أزرار الحالات
   ========================================================= */

document.querySelectorAll(".status-btn").forEach(button => {

  button.addEventListener("click", function() {

    const section = this.dataset.section;
    const status = this.dataset.status;

    if (section === "treasure") {

      state.treasureStatus[day] = status;

      if (status !== "partial") {
        delete state.partials["treasure_" + day];
        document.getElementById("treasurePartialInput").value = "";
      }

      if (status !== "extra") {
        delete state.extra["treasure_" + day];
        document.getElementById("treasureExtraInput").value = "";
      }
    }

    if (section === "new") {

      state.newStatus[day] = status;

      if (status !== "partial") {
        delete state.partials["new_" + day];
        document.getElementById("newPartialInput").value = "";
      }

      if (status !== "extra") {
        delete state.extra["new_" + day];
        document.getElementById("newExtraInput").value = "";
      }
    }

    if (section === "fix") {

      state.fixStatus[day] = status;

    }

    saveState();
    refreshButtons();
    updateStats();
  });

});


/* =========================================================
   إدخال الجزئي والزيادة
   ========================================================= */

document
  .getElementById("treasurePartialInput")
  .addEventListener("input", function() {

    state.partials["treasure_" + day] =
      this.value;

    saveState();
  });


document
  .getElementById("treasureExtraInput")
  .addEventListener("input", function() {

    state.extra["treasure_" + day] =
      this.value;

    saveState();
  });


document
  .getElementById("newPartialInput")
  .addEventListener("input", function() {

    state.partials["new_" + day] =
      this.value;

    saveState();
  });


document
  .getElementById("newExtraInput")
  .addEventListener("input", function() {

    state.extra["new_" + day] =
      this.value;

    saveState();
  });


/* =========================================================
   الأزرار السريعة
   ========================================================= */

document
  .getElementById("treasureQuickDone")
  .addEventListener("click", function() {

    state.treasureStatus[day] = "done";

    delete state.partials["treasure_" + day];
    delete state.extra["treasure_" + day];

    document.getElementById("treasurePartialInput").value = "";
    document.getElementById("treasureExtraInput").value = "";

    saveState();
    refreshButtons();
    updateStats();
  });


document
  .getElementById("treasureQuickMissed")
  .addEventListener("click", function() {

    state.treasureStatus[day] = "missed";

    delete state.partials["treasure_" + day];
    delete state.extra["treasure_" + day];

    document.getElementById("treasurePartialInput").value = "";
    document.getElementById("treasureExtraInput").value = "";

    saveState();
    refreshButtons();
    updateStats();
  });


document
  .getElementById("newQuickDone")
  .addEventListener("click", function() {

    if (day > 18) return;

    state.newStatus[day] = "done";

    delete state.partials["new_" + day];
    delete state.extra["new_" + day];

    document.getElementById("newPartialInput").value = "";
    document.getElementById("newExtraInput").value = "";

    saveState();
    refreshButtons();
    updateStats();
  });


document
  .getElementById("newQuickMissed")
  .addEventListener("click", function() {

    if (day > 18) return;

    state.newStatus[day] = "missed";

    delete state.partials["new_" + day];
    delete state.extra["new_" + day];

    document.getElementById("newPartialInput").value = "";
    document.getElementById("newExtraInput").value = "";

    saveState();
    refreshButtons();
    updateStats();
  });


/* =========================================================
   الإحصائيات
   ========================================================= */

function isDayCompleted(d) {

  const treasure =
    state.treasureStatus[d] === "done";

  const newDone =
    d > 18 ||
    state.newStatus[d] === "done";

  return treasure && newDone;
}


function updateStats() {

  let completed = 0;
  let partialDays = 0;
  let missedDays = 0;

  for (let d = 1; d <= day; d++) {

    if (isDayCompleted(d)) {
      completed++;
    }

    const treasure =
      state.treasureStatus[d];

    const newStatus =
      d <= 18
        ? state.newStatus[d]
        : "done";

    if (
      treasure === "partial" ||
      newStatus === "partial"
    ) {
      partialDays++;
    }

    if (
      treasure === "missed" ||
      newStatus === "missed"
    ) {
      missedDays++;
    }
  }

  document.getElementById("completed").textContent =
    completed;

  document.getElementById("partialDays").textContent =
    partialDays;

  document.getElementById("missedDays").textContent =
    missedDays;

  const progressMessage =
    document.getElementById("progressMessage");

  if (completed === day) {

    progressMessage.textContent =
      "🌟 ممتاز! أنت ملتزم بالخطة حتى الآن.";

  } else if (completed > 0) {

    progressMessage.textContent =
      "💪 استمر، وكل يوم تكمله يقربك أكثر من هدفك.";

  } else {

    progressMessage.textContent =
      "🌱 ابدأ من اليوم، والاستمرار أهم من الكمال.";
  }
}


/* =========================================================
   تحميل البيانات الموجودة في الصفحة
   ========================================================= */

function loadInputs() {

  document.getElementById("treasurePartialInput").value =
    state.partials["treasure_" + day] || "";

  document.getElementById("treasureExtraInput").value =
    state.extra["treasure_" + day] || "";

  document.getElementById("newPartialInput").value =
    state.partials["new_" + day] || "";

  document.getElementById("newExtraInput").value =
    state.extra["new_" + day] || "";
}


/* =========================================================
   بناء التقرير الكامل
   ========================================================= */

function buildReport() {

  const treasureStatus =
    state.treasureStatus[day] || "";

  const newStatus =
    day <= 18
      ? state.newStatus[day] || ""
      : "not_applicable";

  const fixToday =
    getFixationForDay(day);

  const fixStatus =
    fixToday
      ? state.fixStatus[day] || ""
      : "not_applicable";

  const treasurePartial =
    state.partials["treasure_" + day] || "";

  const treasureExtra =
    state.extra["treasure_" + day] || "";

  const newPartial =
    state.partials["new_" + day] || "";

  const newExtra =
    state.extra["new_" + day] || "";

  let report = "";

  report += "تقرير اليوم " + day + "\n\n";

  report += "💎 الكنز\n";
  report += "المطلوب: " +
    (treasurePlan[day - 1] || "") +
    "\n";

  report += "الحالة: " +
    getStatusArabic(treasureStatus) +
    "\n";

  if (treasureStatus === "partial") {
    report +=
      "الجزء الذي لم يتم: " +
      treasurePartial +
      "\n";
  }

  if (treasureStatus === "extra") {
    report +=
      "الزيادة التي تم إنجازها: " +
      treasureExtra +
      "\n";
  }

  report += "\n";

  report += "📘 الجديد\n";

  if (day <= 18) {

    report +=
      "المطلوب: " +
      newPlan[day - 1] +
      "\n";

    report +=
      "الحالة: " +
      getStatusArabic(newStatus) +
      "\n";

    if (newStatus === "partial") {
      report +=
        "الجزء الذي لم يتم: " +
        newPartial +
        "\n";
    }

    if (newStatus === "extra") {
      report +=
        "الزيادة التي تم إنجازها: " +
        newExtra +
        "\n";
    }

  } else {

    report +=
      "لا يوجد جديد في هذا اليوم حسب الخطة الحالية.\n";
  }

  report += "\n";

  report += "🔄 التثبيت\n";

  if (fixToday) {

    report +=
      "المطلوب: " +
      fixToday +
      "\n";

    report +=
      "الحالة: " +
      getFixStatusArabic(fixStatus) +
      "\n";

  } else {

    report +=
      "لا يوجد تثبيت في هذا اليوم.\n";
  }

  return report;
}


/* =========================================================
   تحويل الحالات للعربي
   ========================================================= */

function getStatusArabic(status) {

  const map = {
    done: "تم بأكمله",
    extra: "تم وزيادة",
    partial: "جزئي",
    missed: "لم يتم",
    not_applicable: "غير مطبق"
  };

  return map[status] || "لم يتم تحديد الحالة";
}


function getFixStatusArabic(status) {

  const map = {
    done: "تم",
    missed: "لم يتم",
    not_applicable: "غير مطبق"
  };

  return map[status] || "لم يتم تحديد الحالة";
}


/* =========================================================
   التحقق قبل الإرسال
   ========================================================= */

function validateReport() {

  const message =
    document.getElementById("reportMessage");

  message.className = "message";
  message.textContent = "";

  const treasureStatus =
    state.treasureStatus[day];

  if (!treasureStatus) {

    message.className = "message error";
    message.textContent =
      "⚠️ اختر حالة الكنز أولًا.";

    return false;
  }

  if (treasureStatus === "partial") {

    const value =
      state.partials["treasure_" + day] || "";

    if (!value.trim()) {

      message.className = "message error";
      message.textContent =
        "⚠️ اكتب الجزء الذي لم يتم في الكنز.";

      return false;
    }
  }

  if (treasureStatus === "extra") {

    const value =
      state.extra["treasure_" + day] || "";

    if (!value.trim()) {

      message.className = "message error";
      message.textContent =
        "⚠️ اكتب الزيادة التي أنجزتها في الكنز.";

      return false;
    }
  }

  if (day <= 18) {

    const newStatus =
      state.newStatus[day];

    if (!newStatus) {

      message.className = "message error";
      message.textContent =
        "⚠️ اختر حالة الجديد أولًا.";

      return false;
    }

    if (newStatus === "partial") {

      const value =
        state.partials["new_" + day] || "";

      if (!value.trim()) {

        message.className = "message error";
        message.textContent =
          "⚠️ اكتب الجزء الذي لم يتم في الجديد.";

        return false;
      }
    }

    if (newStatus === "extra") {

      const value =
        state.extra["new_" + day] || "";

      if (!value.trim()) {

        message.className = "message error";
        message.textContent =
          "⚠️ اكتب الزيادة التي أنجزتها في الجديد.";

        return false;
      }
    }
  }

  const fixToday =
    getFixationForDay(day);

  if (fixToday) {

    const fixStatus =
      state.fixStatus[day];

    if (!fixStatus) {

      message.className = "message error";
      message.textContent =
        "⚠️ اختر حالة التثبيت أولًا.";

      return false;
    }
  }

  return true;
}


/* =========================================================
   إرسال التقرير
   ========================================================= */

async function submitReport() {

  if (!validateReport()) {
    return;
  }

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("reportMessage");

  submitButton.disabled = true;
  submitButton.textContent =
    "⏳ جارٍ تسجيل التقرير...";

  const submittedAt =
    new Date().toISOString();

  const dayDate =
    getDayDate();

  const treasureStatus =
    state.treasureStatus[day] || "";

  const newStatus =
    day <= 18
      ? state.newStatus[day] || ""
      : "not_applicable";

  const fixToday =
    getFixationForDay(day);

  const fixStatus =
    fixToday
      ? state.fixStatus[day] || ""
      : "not_applicable";

  const treasurePartial =
    state.partials["treasure_" + day] || "";

  const treasureExtra =
    state.extra["treasure_" + day] || "";

  const newPartial =
    state.partials["new_" + day] || "";

  const newExtra =
    state.extra["new_" + day] || "";

  const report =
    buildReport();

  const payload = {

    day: day,

    date:
      dayDate
        ? dayDate.toISOString()
        : new Date().toISOString(),

    submitted: true,

    submittedAt: submittedAt,

    treasureStatus:
      treasureStatus,

    treasureRequired:
      treasurePlan[day - 1] || "",

    treasurePartial:
      treasurePartial,

    treasureExtra:
      treasureExtra,

    newStatus:
      newStatus,

    newRequired:
      day <= 18
        ? newPlan[day - 1]
        : "",

    newPartial:
      newPartial,

    newExtra:
      newExtra,

    fixationStatus:
      fixStatus,

    fixationRequired:
      fixToday || "",

    report:
      report
  };

  try {

    /*
      نحفظ كل شيء محليًا أولًا،
      بحيث تظل بيانات التقرير موجودة
      حتى لو تأخر الاتصال بالسيرفر.
    */

    state.reportSubmitted[day] = true;
    state.reportSubmittedAt[day] = submittedAt;

    localStorage.setItem(
      "qt_lastReport",
      JSON.stringify(payload)
    );

    saveState();

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      }
    );

    message.className =
      "message success";

    message.textContent =
      "✅ تم إرسال التقرير وحفظه.";

    document.getElementById("successBox").style.display =
      "block";

    submitButton.textContent =
      "✅ تم تسجيل التقرير";

    /*
      الانتقال لصفحة النجاح بعد الإرسال.
    */

    setTimeout(function() {

      location.href =
        "success.html?day=" + day;

    }, 700);

  } catch (error) {

    console.error(error);

    message.className =
      "message error";

    message.textContent =
      "⚠️ حدثت مشكلة أثناء إرسال التقرير. تم الاحتفاظ بالبيانات على الجهاز.";

    submitButton.disabled = false;

    submitButton.textContent =
      "📤 تسجيل تقرير اليوم";
  }
}


/* =========================================================
   زر التسجيل
   ========================================================= */

document
  .getElementById("submitButton")
  .addEventListener(
    "click",
    submitReport
  );


/* =========================================================
   التشغيل الأول
   ========================================================= */

renderDay();
loadInputs();
refreshButtons();
updateStats();

</script>

</body>
