<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f5c3a">
    <title>تقرير اليوم</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top">
        <div class="top-row">
            <a class="back" href="index.html">‹ الرئيسية</a>
            <button id="themeButton" class="theme-button">🌙 الوضع الليلي</button>
        </div>
        <div class="hello">
            <small>📝 تقرير اليوم</small>
            <h1 id="hTitle">جاري التحميل...</h1>
            <span class="gold" id="hSub"> </span>
        </div>
    </header>

    <main class="wrap" id="app">
        <div class="box loading">⏳ جاري تحميل بيانات اليوم...</div>
    </main>

    <script src="engine.js"></script>
    <script>
    (function () {
      QT.applyTheme();
      QT.bindThemeButton("themeButton");
      var $ = function (id) { return document.getElementById(id); };
      var rdate = "", edit = false;
      QT.init(function () {
        rdate = QT.getParam("d");
        if (!QT.isYmd(rdate)) rdate = QT.defaultReportDate();
        edit = QT.getParam("edit") === "1";
        QT.openReport($("app"), rdate, {
          edit: edit,
          setTitle: function (t) { $("hTitle").innerHTML = t; },
          setSub: function (s) { $("hSub").innerHTML = s || " "; }
        });
      }, 0, function (ok, changed) {
        // لو اتضح من الخادم أن تقرير هذا اليوم أُرسل من جهاز آخر: ننتقل لصفحة التقدم
        var st = QT.getState();
        if (changed && !edit && st && QT.reportOf(st, rdate)) window.location.replace("success.html?d=" + rdate);
      });
    })();
    </script>
</body>
</html>
