<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f5c3a">
    <title>خطة حفظ القرآن الكريم</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="rp">

    <header class="top">
        <div class="top-row">
            <a class="back" href="index.html">‹ الرئيسية</a>
            <button id="themeButton" class="theme-button">🌙 الوضع الليلي</button>
        </div>
        <div class="hello">
            <small>📋 خطة الحفظ</small>
            <h1>الكنز + الجديد + التثبيت</h1>
            <span class="gold" id="hdrSub">تابع أيامك وسجّل تقريرك من هنا</span>
        </div>
    </header>

    <main class="wrap">
        <div id="app">
        <div class="loading">⏳ جاري تحميل الخطة...</div>
        </div>
    </main>

    <div id="sheet" class="sheet">
        <div class="sheet-in">
            <div class="sheet-top">
                <div><b id="sheetTitle">تقرير اليوم</b><small id="sheetSub"></small></div>
                <button type="button" id="sheetClose" class="sheet-x">✕</button>
            </div>
            <div id="sheetApp"></div>
        </div>
    </div>

    <script src="engine.js"></script>
    <script>
    (function () {
      QT.applyTheme();
      QT.bindThemeButton("themeButton");
      var $ = function (id) { return document.getElementById(id); };
      var app = $("app"), esc = QT.esc, M = null, showAll = false;

      function badge(st) {
        var m = { done: ["ok", "✅ مكتمل"], compensated: ["ok", "✅ مكتمل (معوَّض)"], missed: ["bad", "⚠️ ناقص"], today: ["blue", "📍 اليوم"], future: ["", "قادم"] };
        var x = m[st] || ["", st];
        return '<span class="badge ' + x[0] + '">' + x[1] + '</span>';
      }
      function dayDetail(d) {
        var h = '', i;
        if (d.nw) h += '<div class="sub">📖 الجديد: من آية ' + d.nw.from + ' إلى ' + d.nw.to + ' (ربع ' + d.nw.q + ' — «' + esc(d.nw.qi.ph.split(" ").slice(0, 4).join(" ")) + '»)' + (d.mode === "rep" ? ' — ' + esc(QT.nSummary(d)) : '') + '</div>';
        if (d.t) {
          var ss = [];
          for (i = 0; i < d.t.segs.length; i++) ss.push(QT.segFull(d.t.segs[i]));
          h += '<div class="sub">💎 الكنز: ' + esc(ss.join(" + ")) + (d.mode === "rep" ? ' — ' + esc(QT.tSummary(d)) : '') + '</div>';
        }
        if (d.fx) {
          var fs = [];
          for (i = 0; i < d.fx.qs.length; i++) { var q = QT.MAIDA[d.fx.qs[i] - 1]; fs.push("ربع " + q.q + " (" + q.s + "–" + q.e + " «" + q.ph.split(" ").slice(0, 3).join(" ") + "»)"); }
          h += '<div class="sub">🔄 التثبيت: ' + esc(fs.join(" + ")) + (d.mode === "rep" ? ' — ' + esc(QT.fSummary(d)) : '') + '</div>';
        }
        return h;
      }
      function dayRow(d) {
        if (d.isFriday) {
          return '<div class="dayline"><div class="meta"><div class="title">🕌 الجمعة — ' + QT.prettyDate(d.date) + '</div><div class="sub">سورة الكهف + تعويض النواقص</div></div>' +
                 '<button type="button" class="btn small gray" data-rep="' + d.date + '">فتح</button></div>';
        }
        var cls = d.status === "today" ? " today" : d.status === "missed" ? " missed" : "";
        var btn = '';
        if (d.status === "done" || d.status === "compensated") btn = '<button type="button" class="btn small blue" data-rep="' + d.date + '" data-edit="1">↩️ إعادة فتح</button>';
        else if (d.status === "today" || d.status === "missed") btn = '<button type="button" class="btn small" data-rep="' + d.date + '">📝 تقرير اليوم</button>';
        return '<div class="dayline' + cls + '"><div class="meta"><div class="title">اليوم ' + d.n + ' — ' + QT.prettyDate(d.date) + ' ' + badge(d.status) + '</div>' + dayDetail(d) + '</div>' + btn + '</div>';
      }

      function draw() {
        var st = QT.getState();
        if (!st.start) { app.innerHTML = '<div class="card"><h2>📅 حدّد تاريخ بداية الخطة أولًا</h2><a class="btn" href="index.html">الرئيسية</a></div>'; return; }
        M = QT.compute(st, QT.todayStr());
        var today = QT.todayStr(), i, h = '';
        var pct = Math.round(M.doneDays / Math.max(1, M.totalDays) * 100);

        /* ملخص */
        var td = M.byDate[today];
        if (td && !td.isFriday && (td.status === "today")) h += '<button type="button" class="send" style="margin-bottom:14px" data-rep="' + today + '">📝 تسجيل تقرير اليوم ' + td.n + '</button>';
        else if (td && td.isFriday && td.status === "today") h += '<button type="button" class="send" style="margin-bottom:14px" data-rep="' + today + '">🕌 تقرير الجمعة</button>';
        h += '<div class="card"><h2>📊 ملخص الخطة</h2>' +
          kv("📅 تاريخ البداية", QT.prettyDate(M.start)) +
          kv("🏁 تنتهي بتاريخ", QT.prettyDate(M.endDate)) +
          kv("💎 مدة الكنز الحالية", M.treasureDays + " يوم") +
          kv("📖 مدة الجديد الحالية", M.newDays + " يوم") +
          kv("✅ الأيام المكتملة", M.doneDays + " (" + pct + "%)") +
          kv("⚠️ الأيام الناقصة", M.missedDays.length) +
          kv("💎 الكنز الناقص", M.tDefTotal ? QT.fmtU(M.tDefTotal) + " ربع" : "0") +
          kv("📖 الجديد الناقص", M.nDefTotal + " آية") +
          '<div class="progress-bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="row" style="margin-top:10px"><input type="date" id="startInput" class="input" style="max-width:200px" value="' + st.start + '">' +
          '<button id="startSave" class="btn small blue">🔁 تغيير تاريخ البداية</button></div>' +
          '<p class="muted">تغيير التاريخ يغيّر البداية فقط، والنظام يعيد حساب الأيام منها.</p></div>';

        /* الأيام القادمة */
        var upcoming = [], done = [];
        for (i = 0; i < M.days.length; i++) {
          var d = M.days[i];
          if (d.isFriday) { if (d.date >= today) upcoming.push(d); continue; }
          if (d.status === "done" || d.status === "compensated") done.push(d);
          else if (d.status === "missed") { /* في قسم الناقصة */ }
          else upcoming.push(d);
        }
        h += '<div class="card"><h2>📍 الأيام الحالية والقادمة</h2>';
        var lim = showAll ? upcoming.length : Math.min(upcoming.length, 7);
        for (i = 0; i < lim; i++) h += dayRow(upcoming[i]);
        if (!upcoming.length) h += '<p class="muted">لا توجد أيام قادمة 🎉</p>';
        if (upcoming.length > 7) h += '<button class="btn small gray" id="toggleAll">' + (showAll ? "إخفاء" : "عرض كل الأيام القادمة (" + upcoming.length + ")") + '</button>';
        h += '</div>';

        /* الأيام الناقصة والتعويض */
        h += '<details class="acc"' + (M.missedDays.length || M.tDefOpen.length || M.nDefOpen.length ? " open" : "") + '><summary>⚠️ الناقص والتعويض (الجمعة)</summary><div class="body" id="compBox"></div></details>';

        /* المكتملة */
        h += '<details class="acc"><summary>✅ الأيام المكتملة (' + done.length + ')</summary><div class="body">';
        if (!done.length) h += '<p class="muted">لا توجد أيام مكتملة بعد.</p>';
        for (i = done.length - 1; i >= 0; i--) h += dayRow(done[i]);
        h += '</div></details>';

        /* الجديد */
        h += '<details class="acc"><summary>📖 خطة الجديد — سورة المائدة</summary><div class="body">';
        for (i = 0; i < QT.MAIDA.length; i++) {
          var q = QT.MAIDA[i], fin = M.qFinish[q.q], dd = [];
          for (var j = 0; j < M.days.length; j++) if (M.days[j].nw && M.days[j].nw.q === q.q) dd.push(M.days[j]);
          h += '<div class="dayline"><div class="meta"><div class="title">ربع ' + q.q + ' — آيات ' + q.s + '–' + q.e + (fin ? ' <span class="badge ok">انتهى</span>' : '') + '</div>' +
               '<div class="sub">يبدأ بـ «' + esc(q.ph) + '»</div>' +
               (dd.length ? '<div class="sub">من اليوم ' + dd[0].n + ' (' + QT.shortDate(dd[0].date) + ') إلى اليوم ' + dd[dd.length - 1].n + ' (' + QT.shortDate(dd[dd.length - 1].date) + ')</div>' : '') + '</div></div>';
        }
        h += '</div></details>';

        /* الكنز */
        h += '<details class="acc"><summary>💎 خطة الكنز — الأنعام إلى الناس</summary><div class="body"><p class="muted">كل يوم ربعان. الأرقام هنا هي الخطة الحالية بعد احتساب الزيادة والنقصان.</p>';
        for (i = 0; i < M.days.length; i++) {
          var dt = M.days[i];
          if (dt.isFriday || !dt.t) continue;
          var ss = [];
          for (j = 0; j < dt.t.segs.length; j++) ss.push(QT.segFull(dt.t.segs[j]));
          h += '<div class="dayline"><div class="meta"><div class="title">اليوم ' + dt.n + ' — ' + QT.shortDate(dt.date) + '</div><div class="sub">' + esc(ss.join(" + ")) + '</div></div></div>';
        }
        h += '</div></details>';

        /* السور */
        var tl = QT.surahTimeline(M), rows = [];
        for (var nm in tl) if (tl.hasOwnProperty(nm)) rows.push([nm, tl[nm]]);
        rows.sort(function (a, b) { return a[1].first.n - b[1].first.n; });
        h += '<details class="acc"><summary>📚 السور وأيام حفظها</summary><div class="body">';
        for (i = 0; i < rows.length; i++) {
          var r = rows[i][1], fin2 = (r.last.status === "done" || r.last.status === "compensated");
          h += '<div class="dayline"><div class="meta"><div class="title">' + esc(rows[i][0]) + (fin2 ? ' <span class="badge ok">انتهت</span>' : '') + '</div>' +
               '<div class="sub">من اليوم ' + r.first.n + ' (' + QT.shortDate(r.first.date) + ') إلى اليوم ' + r.last.n + ' (' + QT.shortDate(r.last.date) + ')</div></div></div>';
        }
        h += '</div></details>';

        app.innerHTML = h;
        QT.renderComp($("compBox"), M, QT.dowOf(today) === 5, draw);
      }
      function kv(a, b) { return '<div class="kv"><span>' + a + '</span><strong>' + b + '</strong></div>'; }

      function openSheet(date, edit) {
        $("sheet").className = "sheet open";
        document.body.style.overflow = "hidden";
        $("sheetApp").innerHTML = "";
        $("sheetTitle").innerHTML = "تقرير اليوم"; $("sheetSub").innerHTML = "";
        QT.openReport($("sheetApp"), date, {
          edit: edit, fromPlan: true, noNav: true,
          setTitle: function (t) { $("sheetTitle").innerHTML = t; },
          setSub: function (s) { $("sheetSub").innerHTML = s; },
          onDone: function (d) { window.location.href = "success.html?d=" + d; }
        });
      }
      function closeSheet() {
        $("sheet").className = "sheet"; document.body.style.overflow = ""; $("sheetApp").innerHTML = ""; draw();
      }
      $("sheetClose").onclick = closeSheet;

      var inner = function (ev) {
        ev = ev || window.event; var t = ev.target || ev.srcElement;
        var rd = t.getAttribute && t.getAttribute("data-rep");
        if (rd) { openSheet(rd, t.getAttribute("data-edit") === "1"); return; }
        while (t && t !== app && !(t.id === "toggleAll" || t.id === "startSave")) t = t.parentNode;
        if (!t || t === app) return;
        if (t.id === "toggleAll") { showAll = !showAll; draw(); }
        if (t.id === "startSave") {
          var v = $("startInput").value;
          if (!QT.isYmd(v)) { QT.toast("اختر تاريخًا صحيحًا", "err2"); return; }
          if (!window.confirm("تغيير تاريخ البداية سيعيد حساب كل الأيام من التاريخ الجديد. متأكد؟")) return;
          QT.setStart(v); draw(); QT.toast("تم تغيير تاريخ البداية ✅", "ok2");
        }
      };
      app.addEventListener ? app.addEventListener("click", inner, false) : (app.onclick = inner);

      QT.init(function () { draw(); }, 6000);
    })();
    </script>
</body>
</html>
