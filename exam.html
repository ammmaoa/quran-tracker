<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f5c3a">
    <meta name="robots" content="noindex">
    <title>اختبار الحفظ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
    <style>
        body.exam { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .ex-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: 0 5px 16px rgba(30,60,45,.08); }
        .ex-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 700; }
        .ex-top span { background: var(--g3); color: var(--g1); border-radius: 12px; padding: 5px 12px; font-size: 14px; }
        body.dark .ex-top span { color: #cfeadb; }
        .ex-top .warn { background: var(--gold2); color: #8a6a14; }
        .ex-timer { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
        .ex-timer.low { background: #fde4e1; color: #b3261e; }
        .ex-bar { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        .ex-bar i { display: block; height: 100%; width: 100%; background: var(--g2); transition: width .25s linear; }
        .ex-prompt { margin: 4px 0 10px; font-weight: 700; font-size: 17px; text-align: center; }
        .ex-ayah { font-family: "Amiri Quran", "Scheherazade New", "Traditional Arabic", serif; font-size: 25px; line-height: 2.2; text-align: center; padding: 10px 8px; background: var(--soft); border-radius: 16px; margin-bottom: 12px; }
        .ex-opt { display: block; width: 100%; margin: 8px 0; padding: 12px 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); font-family: "Amiri Quran", "Scheherazade New", "Traditional Arabic", serif; font-size: 22px; line-height: 2; text-align: center; cursor: pointer; }
        .ex-opt.sel { border-color: var(--g2); background: var(--g3); }
        .ex-opt.name { font-family: "Cairo", Tahoma, Arial, sans-serif; font-size: 19px; font-weight: 700; line-height: 1.6; }
        .ex-acts { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .ex-acts .btn { flex: 1; text-align: center; border: 0; cursor: pointer; font-family: inherit; }
        .ex-acts .btn.off { opacity: .45; pointer-events: none; }
        .ex-acts .btn.alt { background: var(--gold2); color: #7a5d12; }
        .ex-msg { padding: 10px 12px; border-radius: 14px; background: var(--gold2); color: #7a5d12; margin-bottom: 10px; font-weight: 600; text-align: center; }
        .ex-msg.err { background: #fde4e1; color: #b3261e; }
        .ex-msg.ok { background: var(--g3); color: var(--g1); }
        .ex-mic { text-align: center; padding: 6px 0; }
        .ex-mic .big { width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--g1); color: #fff; font-size: 40px; cursor: pointer; }
        .ex-mic .big.rec { background: #c0453a; animation: exPulse 1.1s infinite; }
        @keyframes exPulse { 0% { box-shadow: 0 0 0 0 rgba(192,69,58,.5); } 100% { box-shadow: 0 0 0 22px rgba(192,69,58,0); } }
        .ex-heard { margin: 10px 0; min-height: 38px; padding: 8px 10px; border-radius: 12px; background: var(--soft); text-align: center; font-size: 17px; }
        .ex-score { text-align: center; font-size: 44px; font-weight: 700; color: var(--g1); margin: 6px 0; }
        body.dark .ex-score { color: #7fe0ab; }
        .ex-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); }
        .ex-rev { padding: 10px 0; border-bottom: 1px dashed var(--line); }
        .ex-rev .ay { font-family: "Amiri Quran", "Scheherazade New", "Traditional Arabic", serif; font-size: 20px; line-height: 2; }
        .chip { display: inline-block; margin: 3px 2px; padding: 4px 10px; border-radius: 12px; background: var(--g3); color: var(--ink); font-size: 18px; cursor: pointer; border: 1px solid var(--line); }
        .chip.off { text-decoration: line-through; opacity: .45; background: var(--soft); }
        .ex-ayah.sm { font-size: 20px; line-height: 2; padding: 8px; margin-bottom: 8px; }
        .ex-q { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; background: var(--card); }
        .ex-q.good { border-color: #56b27d; } .ex-q.bad { border-color: #d96a60; } .ex-q.mid { border-color: #d9a93c; }
        .ex-q .qh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
        .ex-q .qp { font-weight: 700; margin: 4px 0; }
        .bd { padding: 2px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; }
        .bd.ok { background: var(--g3); color: var(--g1); } .bd.bad { background: #fde4e1; color: #b3261e; } .bd.half, .bd.void { background: var(--gold2); color: #7a5d12; }
        .ro { font-family: "Amiri Quran", "Scheherazade New", "Traditional Arabic", serif; font-size: 19px; line-height: 2; padding: 6px 10px; margin: 5px 0; border-radius: 12px; border: 1px solid var(--line); }
        .ro.right { background: var(--g3); border-color: #56b27d; } .ro.wrong { background: #fde4e1; border-color: #d96a60; color: #8a1d16; }
        body.dark .ro.wrong { background: #3a1f1c; color: #f2b8b0; } body.dark .bd.bad { background: #3a1f1c; color: #f2b8b0; }
        ul.ex-list { padding-right: 20px; line-height: 2; }
        .ex-credit { text-align: center; font-size: 12px; color: var(--mut); margin: 10px 0 20px; }
    </style>
</head>
<body class="exam">
    <header class="top">
        <div class="top-row">
            <a class="back" id="backLink" href="index.html">‹ الرئيسية</a>
            <button id="themeButton" class="theme-button">🌙 الوضع الليلي</button>
        </div>
        <div class="hello">
            <small id="hSmall">📝 اختبار</small>
            <h1 id="hTitle">اختبار الحفظ</h1>
        </div>
    </header>
    <main class="wrap" id="app"><div class="ex-card">⏳ جاري التحميل...</div></main>
    <div class="ex-credit">نص القرآن الكريم: Tanzil.net — رخصة CC BY 3.0 — <a href="https://tanzil.net" target="_blank" rel="noopener">tanzil.net</a></div>
    <script src="engine.js"></script>
    <script src="exam.js"></script>
</body>
</html>
